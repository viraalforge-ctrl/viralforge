<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ViralForge: conectando</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0D12; color: #EDF0F4;
         font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; }
  .box { max-width: 460px; text-align: center; }
  h1 { font: italic 700 24px/1.2 "Segoe UI", system-ui, sans-serif; margin: 0 0 8px; }
  p { color: #9BA5B3; margin: 0; }
  .err { color: #FF8AA6; }
</style>
</head>
<body>
<div class="box"><h1>Conectando ao ViralForge…</h1><p id="m">Voltando para o painel no seu computador.</p></div>
<script>
/* Página de retorno do login (Facebook/TikTok exigem https). Ela só repassa o código para o painel do
   ViralForge que está rodando no PC de quem fez o login (localhost). Nada é guardado aqui. */
(function () {
  var q = new URLSearchParams(location.search), m = document.getElementById("m");
  var st = q.get("state") || "", info = null;
  try { info = JSON.parse(atob(st.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((st.length + 3) % 4))); } catch (e) {}
  if (!info || ["meta", "tiktok"].indexOf(info.n) < 0 || !/^\d{2,5}$/.test(String(info.p))) {
    m.className = "err"; m.textContent = "Link de login inválido. Volte ao painel do ViralForge e clique em Entrar de novo.";
    return;
  }
  var keep = ["code", "state", "error", "error_description", "scopes"], out = new URLSearchParams();
  keep.forEach(function (k) { if (q.get(k) !== null) out.set(k, q.get(k)); });
  location.replace("http://localhost:" + info.p + "/oauth/" + info.n + "?" + out.toString());
})();
</script>
</body>
</html>
